name: VERBA isolated NPC mesh anomaly diagnosis
on:
  pull_request:
    paths:
      - "VERBA/game/tests/diagnose_genetic_meshes.gd"
      - ".github/workflows/verba-mesh-diagnostic.yml"
jobs:
  material-and-mesh-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: VERBA/game
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.5.2"
          use-dotnet: false
      - name: Import real Godot meshes
        run: godot --headless --path . --editor --import --quit >/tmp/verba-mesh-import.log 2>&1
      - name: Find tall model artifacts near faces
        run: |
          timeout 90s godot --headless --path . --script res://tests/diagnose_genetic_meshes.gd 2>&1 | tee /tmp/mesh-diagnostic.log
          grep -q "PASS: inspected exceptional full-body mesh extents" /tmp/mesh-diagnostic.log
      - name: Preserve standalone mesh diagnosis text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verba-portrait-mesh-diagnosis
          path: /tmp/mesh-diagnostic.log
          if-no-files-found: warn
