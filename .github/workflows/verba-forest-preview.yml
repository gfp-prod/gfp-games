name: VERBA - forest asset art review
on:
  push:
    branches: [verba-godot]
    paths:
      - "VERBA/game/tests/forest_kit_gallery.gd"
      - "VERBA/game/assets/models/cc0/forest/**"
      - ".github/workflows/verba-forest-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forest-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: VERBA/game
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.5.2"
          use-dotnet: false
      - name: Prepare OpenGL display for the real asset previews
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - name: Import sourced forest geometry
        run: godot --headless --path . --editor --import --quit
      - name: Render real 3D candidates
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            godot --path . --rendering-method gl_compatibility \
            --script res://tests/forest_kit_gallery.gd
          test "$(find visual-reports -name 'forestkit_*.png' | wc -l)" -eq 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verba-cc0-forest-preview
          path: VERBA/game/visual-reports/forestkit_*.png
          if-no-files-found: warn
          retention-days: 14
