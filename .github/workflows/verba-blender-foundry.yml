name: VERBA free Blender asset foundry
on:
  push:
    branches: ["verba/blender-asset-foundry"]
    paths:
      - ".github/workflows/verba-blender-foundry.yml"
      - "VERBA/game/tools/art_foundry/**"
      - "VERBA/game/tests/foundry_review.gd"
      - "VERBA/game/docs/ART_FOUNDRY.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verba-blender-asset-foundry
  cancel-in-progress: true

jobs:
  cottage:
    name: Blender model + Godot actual asset review
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: VERBA/game
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install free Blender, virtual display and image checking
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends blender xvfb python3-numpy
          python3 -m pip install --quiet Pillow
          blender --version | head -n 2
          blender -b --python-expr 'import numpy; print("Blender glTF exporter NumPy:",numpy.__version__)'

      - name: Compile and inspect reproducible authoring scripts
        run: |
          python3 -m py_compile tools/art_foundry/forge_cottage.py
          python3 -m py_compile tools/art_foundry/validate_foundry.py
          python3 -m py_compile tools/art_foundry/forge_regions.py

      - name: Build real textured cottage, glTF, editable blend and 4 renders
        run: |
          mkdir -p ../foundry_build
          timeout 1200s xvfb-run -a -s "-screen 0 1280x720x24" \
            blender -b -t 2 --python tools/art_foundry/forge_cottage.py -- \
            --output ../foundry_build

      - name: Prove real geometry, packed CC0 surfaces, meters and camera evidence
        run: |
          python3 tools/art_foundry/validate_foundry.py --out ../foundry_build

      - name: Stage exported glTF into Godot's actual import directory
        run: |
          mkdir -p assets/models/foundry
          cp ../foundry_build/hermit_cottage_v2.glb \
            assets/models/foundry/hermit_cottage_v2.glb
          cp ../foundry_build/provenance.json \
            assets/models/foundry/hermit_cottage_v2.provenance.json

      - name: Forge editable, material-textured regional models
        run: |
          mkdir -p ../regional_build
          timeout 900s xvfb-run -a -s "-screen 0 1280x720x24" \
            blender -b -t 2 --python tools/art_foundry/forge_regions.py -- \
            --output ../regional_build
          python3 - <<'PY'
          import json
          from pathlib import Path
          assets=json.loads(Path("../regional_build/regional_provenance.json").read_text())["assets"]
          assert len(assets)==10
          assert all(x["faces"]>=120 and x["size_bytes"]>3000 for x in assets)
          print("PASS: ten real Blender model families", [(x["name"],x["faces"]) for x in assets])
          PY

      - name: Stage region GLBs before Godot import
        run: |
          cp ../regional_build/*.glb assets/models/foundry/
          cp ../regional_build/regional_provenance.json assets/models/foundry/

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.5.2"
          use-dotnet: false

      - name: Godot import and GDScript compilation
        run: |
          timeout 240s godot --headless --path . --editor --import --quit

      - name: Render live-game old versus new cottage through identical lenses
        run: |
          set -o pipefail
          timeout 720s xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --rendering-driver opengl3 --rendering-method gl_compatibility \
            --path . --script res://tests/foundry_review.gd 2>&1 \
            | tee /tmp/foundry-godot-review.log
          grep -q "PASS: Blender cottage GLB imports" /tmp/foundry-godot-review.log
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|Compile Error:' /tmp/foundry-godot-review.log; then
            echo "::error::Scene screenshot generation reported Godot errors"
            exit 1
          fi
          python3 tools/art_foundry/check_game_comparisons.py

      - name: Verify live landmark visual replacements, physics and three rendered views
        run: |
          set -o pipefail
          timeout 840s xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --rendering-driver opengl3 --rendering-method gl_compatibility \
            --path . --script res://tests/regional_foundry_review.gd 2>&1 \
            | tee /tmp/regional-foundry-review.log
          grep -q "PASS: ten editable Blender GLBs import" /tmp/regional-foundry-review.log
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|Compile Error:|REGIONAL FOUNDRY FAIL:' /tmp/regional-foundry-review.log; then
            echo "::error::Foundry region review failed"
            exit 1
          fi

      - name: Preserve all generated editable art and real gameplay comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verba-blender-cottage-studio
          path: |
            VERBA/foundry_build/*.blend
            VERBA/foundry_build/*.glb
            VERBA/foundry_build/*.png
            VERBA/foundry_build/*.json
            VERBA/regional_build/*.blend
            VERBA/regional_build/*.glb
            VERBA/regional_build/*.json
            VERBA/game/tests/foundry_frames/*.png
            VERBA/game/tests/regional_frames/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Save validated model and origin manifest back to review branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/verba/blender-asset-foundry'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/foundry/hermit_cottage_v2.glb \
            assets/models/foundry/hermit_cottage_v2.provenance.json \
            assets/models/foundry/old_creek_footbridge.glb \
            assets/models/foundry/old_fishing_jetty.glb \
            assets/models/foundry/witness_stone_circle.glb \
            assets/models/foundry/rusting_delivery_wreck.glb \
            assets/models/foundry/dead_ash_tree.glb \
            assets/models/foundry/ridge_arch.glb \
            assets/models/foundry/stone_prayer_shrine.glb \
            assets/models/foundry/cold_charcoal_kiln.glb \
            assets/models/foundry/roadside_station.glb \
            assets/models/foundry/castle_gatehouse.glb \
            assets/models/foundry/regional_provenance.json
          if ! git diff --cached --quiet; then
            git commit -m "VERBA art: checked-in Blender cottage with real texture, UV and gameplay import QA"
            git pull --rebase origin verba/blender-asset-foundry
            git push origin HEAD:verba/blender-asset-foundry
          fi
