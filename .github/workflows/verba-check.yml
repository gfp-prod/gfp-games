name: VERBA Godot source and engine tests
on:
  push:
    branches: [verba-godot]
    paths:
      - "VERBA/game/**"
      - ".github/workflows/verba-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: VERBA/game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.5.2"
          use-dotnet: false
      - name: Complete bundled project check
        shell: bash
        run: |
          test -f project.godot
          test -f main.tscn
          test -f scripts/player.gd
          test "$(find assets/models/authored -name '*.glb' | wc -l)" -ge 3
          test "$(find assets/models/cc0/wildlife \( -name '*.glb' -o -name '*.gltf' \) | wc -l)" -ge 6
          test "$(find assets/textures/real -name '*.jpg' | wc -l)" -ge 18
          python tests/check_project.py
          python tests/validate_books.py
      - name: Import assets and parse scripts in Godot
        run: godot --headless --path . --editor --import --quit
      - name: Runtime smoke test
        run: godot --headless --path . --script res://tests/smoke_test.gd
      - name: Independent ecology state
        run: godot --headless --path . --script res://tests/ecology_smoke_test.gd
      - name: Physics and navigation regression
        run: godot --headless --path . --script res://tests/physics_navigation_test.gd
      - name: Latin books and scholar progression
        run: godot --headless --path . --script res://tests/scholar_progression_test.gd
      - name: Full in-world Latin book discovery and casting loop
        run: godot --headless --path . --script res://tests/book_world_loop_test.gd
      - name: Latin grammar and natural-law spell regression
        run: godot --headless --path . --script res://tests/latin_laws_test.gd
      - name: Emergent heat transfer between natural objects
        run: godot --headless --path . --script res://tests/material_exchange_test.gd
      - name: Continuous offscreen ecology at lower simulation frequency
        run: godot --headless --path . --script res://tests/ecology_lod_test.gd
      - name: Persistent ecosystem JSON save and restore
        run: godot --headless --path . --script res://tests/persistence_test.gd
      - name: Imported wildlife rig and animation validation
        run: godot --headless --path . --script res://tests/wildlife_asset_test.gd
