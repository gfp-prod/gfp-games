name: VERBA Godot source and engine tests
on:
  push:
    branches: [verba-godot]
    paths:
      - "VERBA/game/**"
      - ".github/workflows/verba-check.yml"
  pull_request:
    paths:
      - "VERBA/game/**"
      - ".github/workflows/verba-check.yml"
  workflow_dispatch:

# Also validate the full legacy game loop before merge, rather than
# discovering an obsolete integration assertion only after release.
concurrency:
  group: verba-full-godot-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: VERBA/game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.5.2"
          use-dotnet: false
      - name: Complete bundled project check
        shell: bash
        run: |
          test -f project.godot
          test -f main.tscn
          test -f scripts/player.gd
          test "$(find assets/models/authored -name '*.glb' | wc -l)" -ge 3
          test "$(find assets/models/cc0/wildlife \( -name '*.glb' -o -name '*.gltf' \) | wc -l)" -ge 6
          test "$(find assets/textures/real -name '*.jpg' | wc -l)" -ge 18
          python tests/check_project.py
          python tests/validate_books.py
          python tests/validate_visual_assets.py
      - name: Import assets and parse scripts in Godot
        run: |
          godot --headless --path . --editor --import --quit 2>&1 | tee godot-import.log
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|Compile Error:' godot-import.log; then
            echo "::error::Godot reported a script compilation failure despite a zero exit code"
            exit 1
          fi
      - name: Runtime smoke test
        run: bash tests/godot_guard.sh res://tests/smoke_test.gd
      - name: Independent ecology state
        run: bash tests/godot_guard.sh res://tests/ecology_smoke_test.gd
      - name: Physics and navigation regression
        run: bash tests/godot_guard.sh res://tests/physics_navigation_test.gd
      - name: Physically blocked pickups cannot be looted through walls
        run: bash tests/godot_guard.sh res://tests/pickup_line_of_sight_test.gd
      - name: Bound book geometry, page normals and ink contact
        run: bash tests/godot_guard.sh res://tests/grimoire_geometry_test.gd
      - name: Cottage, sculpted glove and riverbank hero-art regression
        run: bash tests/godot_guard.sh res://tests/hero_art_test.gd
      - name: Real cottage level footing and living vegetation exclusion
        run: bash tests/godot_guard.sh res://tests/cottage_footprint_test.gd
      - name: Real hinged vellum page turn and in-book ink transition
        run: bash tests/godot_guard.sh res://tests/grimoire_page_turn_test.gd
      - name: Latin books and scholar progression
        run: bash tests/godot_guard.sh res://tests/scholar_progression_test.gd
      - name: Full in-world Latin book discovery and casting loop
        run: bash tests/godot_guard.sh res://tests/book_world_loop_test.gd
      - name: Stable character genetics and outward-facing anatomical mesh regression
        run: bash tests/godot_guard.sh res://tests/npc_genetic_art_test.gd
      - name: Physical NPC conversation, Latin progression, trade and persistence
        run: bash tests/godot_guard.sh res://tests/social_dialogue_test.gd
      - name: Living familiar choice, Latin commands and saved companion identity
        run: bash tests/godot_guard.sh res://tests/familiar_progression_test.gd
      - name: Wolf survival, stamina, herb recovery and consequential defeat
        run: bash tests/godot_guard.sh res://tests/survival_loop_test.gd
      - name: Gather physical wood and stone and persist a snapped solid tower
        run: bash tests/godot_guard.sh res://tests/tower_construction_test.gd
      - name: Latin grammar and natural-law spell regression
        run: bash tests/godot_guard.sh res://tests/latin_laws_test.gd
      - name: Magic failure is physically and economically inert
        run: bash tests/godot_guard.sh res://tests/magic_fizzle_test.gd
      - name: Emergent heat transfer between natural objects
        run: bash tests/godot_guard.sh res://tests/material_exchange_test.gd
      - name: Continuous offscreen ecology at lower simulation frequency
        run: bash tests/godot_guard.sh res://tests/ecology_lod_test.gd
      - name: Persistent ecosystem JSON save and restore
        run: bash tests/godot_guard.sh res://tests/persistence_test.gd
      - name: Complete save, loot, wildlife identity and recovery regression
        run: bash tests/godot_guard.sh res://tests/save_integrity_regression_test.gd
      - name: Imported wildlife rig and animation validation
        run: bash tests/godot_guard.sh res://tests/wildlife_asset_test.gd
      - name: Moonlit sky and atmosphere are not a darkened daylight sky
        run: bash tests/godot_guard.sh res://tests/day_night_art_test.gd
      - name: Scene/node and ecology CPU profiling baseline
        run: bash tests/godot_guard.sh res://tests/performance_baseline.gd
