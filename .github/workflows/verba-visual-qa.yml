name: VERBA visual rendering QA
on:
  push:
    branches: [verba-godot]
    paths:
      - "VERBA/game/tests/visual_gallery.gd"
      - "VERBA/game/tests/world_gallery.gd"
      - "VERBA/game/tests/visual_pixel_gate.py"
      - "VERBA/game/tests/make_motion_gifs.py"
      - "VERBA/game/scripts/creature.gd"
      - "VERBA/game/scripts/world.gd"
      - "VERBA/game/scripts/world_laws.gd"
      - "VERBA/game/scripts/latin_grammar.gd"
      - "VERBA/game/scripts/material_exchange.gd"
      - "VERBA/game/assets/models/cc0/nature/**"
      - "VERBA/game/assets/models/cc0/wildlife/**"
      - ".github/workflows/verba-visual-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: VERBA/game
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.5.2"
          use-dotnet: false
      - name: Set up actual OpenGL screenshot rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils
      - name: Import all 3D models
        run: godot --headless --path . --editor --import --quit
      - name: Render every animal in actual Godot 3D
        run: |
          mkdir -p visual-reports
          xvfb-run -a -s "-screen 0 1280x800x24" \
            godot --path . --rendering-method gl_compatibility \
            --script res://tests/visual_gallery.gd
          test "$(find visual-reports -name '*.png' | wc -l)" -ge 15
      - name: Render actual first-person game view
        run: |
          xvfb-run -a -s "-screen 0 1280x800x24" \
            godot --path . --rendering-method gl_compatibility \
            --script res://tests/world_gallery.gd
          test "$(find visual-reports -name 'world_spawn_*.png' | wc -l)" -eq 4
      - name: Automatic screenshot coverage gate
        run: |
          python3 -m pip install --quiet --break-system-packages Pillow
          python3 tests/visual_pixel_gate.py
      - name: Build actual animated motion previews
        run: python3 tests/make_motion_gifs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verba-wildlife-visual-gallery
          path: |
            VERBA/game/visual-reports/*.png
            VERBA/game/visual-reports/*.gif
            VERBA/game/assets/models/cc0/wildlife/Hare.glb
            VERBA/game/assets/models/cc0/wildlife/ForestRabbit.glb
          if-no-files-found: warn
          retention-days: 14
