name: VERBA - bundle missing animated wildlife
on:
  push:
    branches: [verba-godot]
    paths:
      - ".github/workflows/verba-add-wildlife.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verba-godot
          persist-credentials: true
      - name: Download verified replacement hare and crow
        shell: bash
        run: |
          python3 - <<'PY'
          import json,struct,hashlib,time
          from pathlib import Path
          from urllib.request import Request,urlopen
          targets = [
            ("Hare.glb", "https://gobkit.com/freebies/animal006/Hare.glb"),
            ("Crow.glb", "https://polyfork.dev/cdn/crow-base.glb"),
          ]
          directory = Path("VERBA/game/assets/models/cc0/wildlife")
          directory.mkdir(parents=True, exist_ok=True)
          lines = [
            "# Additional wildlife sources", "",
            "Hare: Gobkit CC0 animated animal collection — https://gobkit.com/api/free",
            "Crow: Polyfork Crow asset, CC BY 4.0 when redistributed:",
            "https://polyfork.dev/asset/crow-base",
            "Model by Polyfork (Lucas Martinic), https://polyfork.dev/asset/crow-base",
            "The crow uses named wing/head/leg pivots animated by the game, not a skeletal action library.",
            "",
          ]
          for filename,url in targets:
            for attempt in range(4):
              try:
                with urlopen(Request(url,headers={"User-Agent":"VERBA-CC0-asset-bundler/1.0"}),timeout=60) as resp: data=resp.read()
                break
              except Exception:
                if attempt == 3: raise
                time.sleep(2 ** attempt)
            assert len(data) > 10000, filename+" too small"
            assert data[:4] == b"glTF",filename+" not a glTF binary"
            magic,version,size=struct.unpack_from("<4sII",data)
            assert version == 2 and size == len(data),filename+" bad glTF length"
            assert data[16:20] == b"JSON",filename+" missing JSON chunk"
            json_len=struct.unpack_from("<I",data,12)[0]
            doc=json.loads(data[20:20+json_len].decode('utf-8').rstrip(" \t\r\n\x00"))
            assert doc.get("meshes"),filename+" has no geometry"
            if filename=="Hare.glb":
              assert doc.get("skins") and doc.get("animations"),"Hare missing skeleton animation"
            else:
              assert any(n.get("name","").lower().endswith("wing") for n in doc.get("nodes",[])),"Crow missing pivot nodes"
            (directory/filename).write_bytes(data)
            lines.append(filename+" — "+str(len(data))+" bytes — SHA256 "+hashlib.sha256(data).hexdigest())
            print(filename, "meshes",len(doc.get("meshes",[])),"skins",len(doc.get("skins",[])),"clips",len(doc.get("animations",[])))
          (directory/"SOURCES_EXTRA.md").write_text("\n".join(lines)+"\n",encoding="utf-8")
          PY
      - name: Commit included assets (not runtime downloads)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERBA/game/assets/models/cc0/wildlife/
          if ! git diff --cached --quiet; then
            git commit -m "VERBA: bundle hare and real crow model"
            git pull --rebase origin verba-godot
            git push origin HEAD:verba-godot
          fi
