name: VERBA - unpack complete Godot project
on:
  push:
    branches: [verba-godot]
    paths:
      - "VERBA/packed/**"
      - ".github/workflows/verba-expand.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verba-godot
          fetch-depth: 1
      - name: Verify and reconstruct VERBA v1.2.1
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, io, shutil, zipfile
          parts = sorted(Path("VERBA/packed").glob("segment_*.bin"))
          assert len(parts) == 50, f"Expected 50 segments, got {len(parts)}"
          archive = b"".join(p.read_bytes() for p in parts)
          expected = "a790f90d312e849548b1584a84833d1682c80e33b754f9aabb48bb58773365b1"
          digest = hashlib.sha256(archive).hexdigest()
          assert digest == expected, f"Invalid archive: {digest}"
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              assert z.testzip() is None
              z.extractall("/tmp/verba-expanded")
          src = Path("/tmp/verba-expanded/VERBA-v1.2.1")
          assert (src / "project.godot").is_file()
          assert len(list((src / "assets/models/authored").glob("*.glb"))) == 8
          assert len(list((src / "assets/textures/real").glob("*.jpg"))) == 18
          dest = Path("VERBA/game")
          shutil.copytree(src, dest, dirs_exist_ok=True)
          print(f"Expanded project: {len(list(dest.rglob('*')))} entries")
          PY
      - name: Commit expanded native Godot project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERBA/game
          if git diff --cached --quiet; then
            echo "Game tree already up to date."
          else
            git commit -m "VERBA: publish fully bundled Godot project (models and textures included)"
            git push origin HEAD:verba-godot
          fi
