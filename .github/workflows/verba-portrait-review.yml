name: VERBA village characters and interiors visual proof
on:
  pull_request:
    paths:
      - "VERBA/game/scripts/folk_portrait_finish.gd"
      - "VERBA/game/scripts/npc_actor.gd"
      - "VERBA/game/scripts/folk_costume_finish.gd"
      - "VERBA/game/scripts/household_interiors.gd"
      - "VERBA/game/scripts/village_homesteads.gd"
      - "VERBA/game/tests/folk_portrait_gallery.gd"
      - ".github/workflows/verba-portrait-review.yml"
concurrency:
  group: verba-portrait-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  genuine-godot-screens:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: VERBA/game
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.5.2"
          use-dotnet: false
      - name: Import models and verify source compiles
        run: |
          godot --headless --path . --editor --import --quit 2>&1 | tee /tmp/portraits-import.log
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|Compile Error:' /tmp/portraits-import.log; then exit 1; fi
      # The independent VERBA CI already runs the complete character and
      # gameplay regression. Keep this workflow dedicated to early visual proof.
      - name: Photograph actual villagers and house interiors
        run: xvfb-run -a -s "-screen 0 1280x720x24" godot --rendering-driver opengl3 --rendering-method gl_compatibility --path . --script res://tests/folk_portrait_gallery.gd
      - name: Attach separate ordinary screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verba-village-portrait-and-interior-pngs
          path: VERBA/game/tests/portrait_screens/*.png
          if-no-files-found: warn
          retention-days: 30
