name: VERBA genetic face and bloodline world screenshots
on:
  pull_request:
    paths:
      - "VERBA/game/scripts/npc_genetics.gd"
      - "VERBA/game/scripts/folk_portrait_finish.gd"
      - "VERBA/game/scripts/npc_actor.gd"
      - "VERBA/game/scripts/village_sim.gd"
      - "VERBA/game/scripts/world.gd"
      - "VERBA/game/tests/genetic_faces_gallery.gd"
      - ".github/workflows/verba-genetic-gallery.yml"
concurrency:
  group: verba-genetic-gallery-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  true-world-faces:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: VERBA/game
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.5.2"
          use-dotnet: false
      - name: Import real source, visuals and world models
        run: |
          godot --headless --path . --editor --import --quit 2>&1 | tee /tmp/gene-import.log
          if grep -E 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|Compile Error:' /tmp/gene-import.log; then exit 1; fi
      - name: Photograph inherited physical faces and bodies inside Godot
        run: |
          timeout 190s xvfb-run -a -s "-screen 0 1280x720x24" godot --rendering-driver opengl3 --rendering-method gl_compatibility --path . --script res://tests/genetic_faces_gallery.gd 2>&1 | tee /tmp/genetic-gallery.log
          grep -q "PASS: thirteen actual Godot inherited face and body PNG frames" /tmp/genetic-gallery.log
      - name: Upload individual actual game screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verba-heritable-npc-faces-and-bodies
          path: VERBA/game/tests/genetic_faces/*.png
          if-no-files-found: warn
          retention-days: 30
