name: VERBA independent Godot CI
on:
  push:
    branches: [verba-godot]
    paths: ["VERBA/game/**", ".github/workflows/verba-godot.yml"]
  pull_request:
    paths: ["VERBA/game/**", ".github/workflows/verba-godot.yml"]
concurrency:
  # Push and PR events for the same branch share one run slot.
  # Superseded expensive renders are cancelled when a newer commit arrives.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: VERBA/game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.5.2"
          use-dotnet: false
      - name: Static validation
        run: python tests/check_project.py
      - name: Physical book grammar and canonical lexicon agreement
        run: python tests/validate_books.py
      - name: Original licensed textures and terrain atlas integrity
        run: python tests/validate_visual_assets.py
      - name: Import and compile project
        run: godot --headless --path . --editor --import --quit
      - name: World smoke
        run: godot --headless --path . --script res://tests/smoke_test.gd
      - name: Village seeded adversarial regression
        run: godot --headless --path . --script res://tests/village_sim_test.gd
      - name: Resource economy and simulation inspector
        run: godot --headless --path . --script res://tests/village_economy_test.gd
      - name: Strange road and castle district
        run: |
          timeout 90s godot --headless --path . --script res://tests/strange_road_test.gd 2>&1 | tee /tmp/verba-road-test.log
          grep -q "PASS: station and medieval castle share authored road" /tmp/verba-road-test.log
      - name: Two-story tower construction
        run: |
          timeout 90s godot --headless --path . --script res://tests/two_story_tower_test.gd 2>&1 | tee /tmp/verba-two-story-test.log
          grep -q "PASS: two-story tower supports physical floors" /tmp/verba-two-story-test.log
      - name: Living herb harvest and spell regeneration
        run: |
          timeout 90s godot --headless --path . --script res://tests/living_herb_test.gd 2>&1 | tee /tmp/verba-herb-test.log
          grep -q "PASS: spell-grown plant harvests real herb" /tmp/verba-herb-test.log
      - name: Player-driven farm to bakery trade
        run: |
          timeout 90s godot --headless --path . --script res://tests/player_market_test.gd 2>&1 | tee /tmp/verba-market-test.log
          grep -q "PASS: player herb->grain->bread trade" /tmp/verba-market-test.log
      - name: Village worksite visuals and real production
        run: |
          timeout 90s godot --headless --path . --script res://tests/visible_workplaces_test.gd 2>&1 | tee /tmp/verba-workplaces-test.log
          grep -q "PASS: farm bakery forge market visible" /tmp/verba-workplaces-test.log
      - name: Physical labor, harvested cargo and save-safe production
        run: |
          timeout 90s godot --headless --path . --script res://tests/physical_labor_test.gd 2>&1 | tee /tmp/verba-labor-test.log
          grep -q "PASS: physical work orders" /tmp/verba-labor-test.log
      - name: Physical villagers interaction and movement
        run: godot --headless --path . --script res://tests/physical_village_test.gd
      - name: Witness-restricted rumor dialogue
        run: godot --headless --path . --script res://tests/village_rumor_test.gd
      - name: Book-learned Latin nurtures real harvested crops
        run: |
          timeout 90s godot --headless --path . --script res://tests/latin_field_economy_test.gd 2>&1 | tee /tmp/verba-field-test.log
          grep -q "PASS: study-gated plural Latin" /tmp/verba-field-test.log
      - name: Diegetic wizard training and retained Latin fluency
        run: |
          timeout 90s godot --headless --path . --script res://tests/latin_wizard_training_test.gd 2>&1 | tee /tmp/verba-latin-training.log
          grep -q "PASS: diegetic wizard grimoire" /tmp/verba-latin-training.log
      - name: Latin compositional spells
        run: godot --headless --path . --script res://tests/latin_composition_test.gd
      - name: Field experiment notebook and true Latin observations
        run: |
          timeout 90s godot --headless --path . --script res://tests/magical_experiment_test.gd 2>&1 | tee /tmp/verba-experiment-test.log
          grep -q "PASS: empirical Latin experiments" /tmp/verba-experiment-test.log
      - name: Apprenticeship and real commissioned Latin harvest loop
        run: |
          timeout 90s godot --headless --path . --script res://tests/wizard_commission_loop_test.gd 2>&1 | tee /tmp/verba-wizard-loop.log
          grep -q "PASS: authoritative clock day/night" /tmp/verba-wizard-loop.log
      - name: Full physical book scholarship and mana regression
        run: godot --headless --path . --script res://tests/scholar_progression_test.gd
      - name: Full first-person book pickup to magic and restoration
        run: godot --headless --path . --script res://tests/book_world_loop_test.gd
      - name: Social trade regression
        run: godot --headless --path . --script res://tests/social_dialogue_test.gd
      - name: Produced Latin affects real NPCs, books and bakery stock
        run: |
          timeout 90s godot --headless --path . --script res://tests/typed_npc_latin_test.gd 2>&1 | tee /tmp/verba-typed-conversations.log
          grep -q "PASS: produced Latin cases" /tmp/verba-typed-conversations.log
      - name: Immortal return and persistent passing time
        run: |
          timeout 90s godot --headless --path . --script res://tests/survival_loop_test.gd 2>&1 | tee /tmp/verba-survival-test.log
          grep -q "PASS: wolf pursuit, physical bite" /tmp/verba-survival-test.log
      - name: Save integrity regression
        run: godot --headless --path . --script res://tests/save_integrity_regression_test.gd
      - name: Ecology baseline
        run: godot --headless --path . --script res://tests/ecology_smoke_test.gd

  visual-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: VERBA/game
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.5.2"
          use-dotnet: false
      - name: Import assets
        run: godot --headless --path . --editor --import --quit
      - name: Capture actual rendered views through Xvfb
        run: xvfb-run -a -s "-screen 0 1280x720x24" godot --rendering-driver opengl3 --rendering-method gl_compatibility --path . --script res://tests/visual_snapshots.gd
      - name: Preserve screenshots as review artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verba-fixed-visual-qa
          path: VERBA/game/tests/screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
