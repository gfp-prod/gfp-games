name: VERBA - source CC0 sculpted forest vegetation
on:
  push:
    branches: [verba-godot]
    paths: [".github/workflows/verba-forest-asset-source.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: verba-godot
      - name: Fetch and validate public-domain woodland mesh library
        run: |
          python3 - <<'PY'
          import json, struct, hashlib
          from pathlib import Path
          from urllib.request import urlopen,Request
          pinned="9f7dc6536aacbce2203bb705e3f0cf1772ea3fb7"
          url=f"https://raw.githubusercontent.com/Station-Sciences/bot-crossing/{pinned}/public/assets/forest.glb"
          with urlopen(Request(url,headers={"User-Agent":"VERBA-CC0-sourced-woodland/1.0"}),timeout=60) as response: data=response.read()
          assert data[:4]==b"glTF" and len(data)>20000, "Not valid GLB"
          assert struct.unpack_from("<I",data,8)[0]==len(data), "GLB length corruption"
          chunk_size=struct.unpack_from("<I",data,12)[0]
          assert data[16:20]==b"JSON"
          obj=json.loads(data[20:20+chunk_size].decode("utf-8").rstrip("\x00 \t\r\n"))
          assert obj.get("meshes") and obj.get("nodes"), "No geometry"
          path=Path("VERBA/game/assets/models/cc0/forest/ForestNatureKit.glb")
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_bytes(data)
          (path.parent/"CATALOG.json").write_text(json.dumps({
             "title":"KayKit Forest Nature Pack (republished as packed art scene in bot-crossing)",
             "source_url":url,"license":"CC0-1.0 for bundled asset, per public/assets/CREDITS.md",
             "original":"Kay Lousberg (KayKit Forest Nature Pack)",
             "repackaging":"Station-Sciences/bot-crossing",
             "sha256":hashlib.sha256(data).hexdigest(),
             "meshes":[m.get("name",f"Mesh {i}") for i,m in enumerate(obj["meshes"])],
             "nodes":[{"id":i,"name":n.get("name",""),"mesh":n.get("mesh"),
                       "scale":n.get("scale"),"translation":n.get("translation")}
                       for i,n in enumerate(obj["nodes"]) if "mesh" in n],
             "materials":[m.get("name",f"Mat {i}") for i,m in enumerate(obj.get("materials",[]))]
           },indent=2)+"\n")
          print("CC0 FOREST LIBRARY",len(obj["meshes"]),"meshes",len(obj["nodes"]),"nodes")
          PY
      - name: Commit downloaded model and origin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERBA/game/assets/models/cc0/forest/
          if ! git diff --cached --quiet; then
            git commit -m "VERBA art: bundle pinned CC0 KayKit forest kit for sculpted undergrowth"
            git pull --rebase origin verba-godot
            git push origin HEAD:verba-godot
          fi
